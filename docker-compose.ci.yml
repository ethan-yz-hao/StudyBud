# Runtime compose for the apps EC2 box using prebuilt ECR images (built by CI).
# Data persists on the /data volume; the shared Caddy proxy fronts this on `edge`.
# deploy.sh sets APP_IMAGE / PROXY_IMAGE and sources .env before `up`.

services:
  app:
    image: ${APP_IMAGE}
    restart: always
    volumes:
      - assets-data:/app/assets/
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - USE_X_FORWARDED_PROTO=${USE_X_FORWARDED_PROTO:-1}
    depends_on:
      - db
    networks:
      - network-1

  db:
    image: postgres:13-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - network-1

  proxy:
    image: ${PROXY_IMAGE}
    restart: always
    depends_on:
      - app
    expose:
      - "8000"
    volumes:
      - assets-data:/vol/assets
    networks:
      network-1: {}
      edge:
        aliases:
          - studybud

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgres
  assets-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/assets

networks:
  network-1:
  edge:
    external: true
