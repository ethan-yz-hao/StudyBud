version: '3.9'

services:
  app:
    build:
      context: .
    restart: always
    volumes:
      - assets-data:/app/assets/
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - USE_X_FORWARDED_PROTO=${USE_X_FORWARDED_PROTO:-0}
    depends_on:
      - db
    networks:
      - network-1

  db:
    image: postgres:13-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - network-1

  proxy:
    build:
      context: ./proxy
    restart: always
    depends_on:
      - app
    # No host ports and no TLS here: the shared Caddy proxy on the box terminates
    # the Cloudflare origin cert and reverse-proxies to this nginx over `edge`.
    expose:
      - "8000"
    volumes:
      - assets-data:/vol/assets
    networks:
      network-1: {}
      edge:
        aliases:
          - studybud


volumes:
  postgres-data:
  assets-data:

networks:
  network-1:
  edge:
    external: true
